<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrodeio-llm</title>
<style>
  :root {
    --bg: #0b0f0b;
    --fg: #c8ffcf;
    --dim: #6fae78;
    --accent: #ffcf6f;
    --panel: #10160f;
    --border: #23331f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 18px 20px 8px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
  header h1 .prompt { color: var(--accent); }
  header p { margin: 6px 0 0; color: var(--dim); font-size: 13px; }

  .versions {
    display: flex; gap: 8px; padding: 14px 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .vbtn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    padding: 8px 12px; font-family: inherit; font-size: 13px; cursor: pointer;
    border-radius: 3px;
  }
  .vbtn:hover { border-color: var(--dim); }
  .vbtn.active { border-color: var(--accent); color: var(--accent); }
  #vdesc { padding: 0 20px 14px; color: var(--dim); font-size: 12.5px; max-width: 760px; }
  #vdesc .speed { color: var(--accent); }

  #term {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    font-size: 14px; line-height: 1.55; white-space: pre-wrap;
  }
  .line-you { color: var(--fg); }
  .line-you::before { content: "você> "; color: var(--accent); }
  .line-model { color: var(--fg); margin: 4px 0 18px 0; }
  .line-meta { color: var(--dim); font-size: 12px; }
  .line-err { color: #ff8080; }
  .cursor { display: inline-block; width: 8px; background: var(--fg); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  form {
    display: flex; gap: 8px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  form .prompt-char { color: var(--accent); padding-top: 9px; }
  textarea {
    flex: 1; resize: none; background: transparent; color: var(--fg);
    border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px;
    font-family: inherit; font-size: 14px; height: 40px;
  }
  textarea:focus { outline: none; border-color: var(--dim); }
  button[type=submit] {
    background: var(--accent); color: #1a1400; border: none; border-radius: 3px;
    padding: 0 18px; font-family: inherit; font-weight: 600; cursor: pointer;
  }
  button[type=submit]:disabled { opacity: 0.5; cursor: default; }
  footer { padding: 8px 20px 14px; color: var(--dim); font-size: 11px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>

<header>
  <h1><span class="prompt">$</span> arrodeio-llm</h1>
  <p>três estágios do mesmo projeto — do zero até um modelo que segue instrução em cordel</p>
</header>

<div class="versions" id="versions"></div>
<div id="vdesc"></div>

<div id="term"></div>

<form id="form">
  <div class="prompt-char">›</div>
  <textarea id="prompt" placeholder="ex: Glose o mote: «Água mole em pedra dura.»"></textarea>
  <button type="submit" id="send">enviar</button>
</form>

<footer>
  código e detalhes técnicos em
  <a href="https://github.com/bsana1/arrodeio-llm" target="_blank">github.com/bsana1/arrodeio-llm</a>
</footer>

<script>
const term = document.getElementById('term');
const versionsEl = document.getElementById('versions');
const vdesc = document.getElementById('vdesc');
const form = document.getElementById('form');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');

let META = {};
let current = 'v2';

function println(cls, text) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
  return div;
}

function renderVersions() {
  versionsEl.innerHTML = '';
  for (const [id, meta] of Object.entries(META)) {
    const b = document.createElement('button');
    b.className = 'vbtn' + (id === current ? ' active' : '');
    b.textContent = meta.label;
    b.onclick = () => { current = id; renderVersions(); renderDesc(); };
    versionsEl.appendChild(b);
  }
}

function renderDesc() {
  const m = META[current];
  vdesc.innerHTML = m.desc + '  <span class="speed">· ' + m.speed + '</span>';
}

async function boot() {
  try {
    const r = await fetch('/api/versions');
    META = await r.json();
  } catch (e) {
    META = { v2: { label: 'v2', desc: 'não consegui carregar /api/versions', speed: '' } };
  }
  renderVersions();
  renderDesc();
  println('line-meta', '— escolha uma versão acima e mande um mote ou tema —');
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const text = promptEl.value.trim();
  if (!text || sendBtn.disabled) return;

  println('line-you', text);
  promptEl.value = '';
  sendBtn.disabled = true;

  const meta = META[current] || {};
  const waiting = println('line-meta', `[${meta.label}] gerando… ${meta.speed || ''}`);
  const t0 = Date.now();
  const timer = setInterval(() => {
    waiting.textContent = `[${meta.label}] gerando… ${((Date.now() - t0) / 1000).toFixed(0)}s`;
  }, 1000);

  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: current, prompt: text }),
    });
    const data = await r.json();
    clearInterval(timer);
    waiting.remove();
    if (data.error) {
      println('line-err', 'erro: ' + data.error);
    } else {
      println('line-model', data.text);
      println('line-meta', `(${data.elapsed_s}s)`);
    }
  } catch (e) {
    clearInterval(timer);
    waiting.remove();
    println('line-err', 'erro de conexão: ' + e);
  } finally {
    sendBtn.disabled = false;
    promptEl.focus();
  }
});

promptEl.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) {
    ev.preventDefault();
    form.requestSubmit();
  }
});

boot();
</script>
</body>
</html>
